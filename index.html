<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>worldpulse</title>
    <meta name="description" content="Live intelligence dashboard for every country on Earth." />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">worldpulse</div>
        <div id="search" class="search"></div>
        <div id="mode" class="mode"></div>
        <button type="button" id="flat-launch" class="tour-launch"
          aria-pressed="false" aria-label="Switch between the globe and a flat map">Flat map</button>
        <button type="button" id="lists-launch" class="tour-launch"
          aria-label="Browse everything as lists">Lists</button>
        <button type="button" id="tour-launch" class="tour-launch"
          aria-label="Show the guided tour">? Tour</button>
        <div class="build-step">v1 · core complete</div>
      </header>

      <div id="seed-banner" class="seed-banner"></div>
      <div id="tour" class="tour" hidden></div>
      <div id="lists" class="lists" hidden></div>
      <div id="palette" class="palette" hidden></div>

      <main id="stage">
        <aside id="rail" class="rail" aria-label="Layer and weight controls">
          <div id="layers"></div>
          <div id="event-list"></div>
          <div id="gallery"></div>
        </aside>
        <!-- globe.gl replaces the contents of #globe, so #flatmap must be a
             SIBLING sharing the same grid cell, never a child. -->
        <div class="globe-cell">
          <div id="globe" class="globe"></div>
          <div id="flatmap" class="flatmap" hidden></div>
        </div>
        <aside id="panel" class="panel" aria-label="Country dossier"></aside>
      </main>

      <footer id="statusbar">
        <span>Click to select · Ctrl/Cmd-click to add · Esc to clear · / to search</span>
        <span class="spacer"></span>
        <span>Polygons: Natural Earth (public domain)</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
